server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Must exceed MAX_VIDEO_SIZE_MB plus multipart overhead. Raise it if you raise that limit.
    client_max_body_size 110m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # nginx appends the client address; the backend trusts only the LAST entry.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 330s;
        proxy_read_timeout 330s;
        # Request buffering stays ON (the default): the backend requires a Content-Length
        # on uploads, which nginx supplies after buffering the body.
    }

    location / {
        try_files $uri /index.html;
    }
}